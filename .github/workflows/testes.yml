name: Testes

# Corre o teste automático (câmara e microfone falsos) sempre que envias código.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      - run: npm ci
      - name: Testar a app
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm test
        env:
          CAPTURA_CAPTURAS: capturas
      - name: Testar com o Windows a 150%
        run: xvfb-run -a -s "-screen 0 2400x1500x24" npm test
        env:
          CAPTURA_ESCALA: '1.5'
      - name: Guardar capturas de ecrã
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas
          if-no-files-found: ignore
